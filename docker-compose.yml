version: '3.8'

services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist SQLite database
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Optional: separate service for running the scraper manually
  # Run with: docker-compose run --rm scraper
  scraper:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m scripts.refresh_events
    profiles:
      - tools
