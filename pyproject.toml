[tool.poetry]
name = "stst_dev"
version = "0.1.0"
description = "STST Events Scraper and Dashboard - scrape event data from Skip the Small Talk website and manage with a Streamlit dashboard"
authors = ["Ellen <ellen.degenn@gmail.com>"]
readme = "README.md"
packages = [{include = "stst_dev"}]

[tool.poetry.dependencies]
python = "^3.11"
jupyter = "^1.0.0"
numpy = "^1.26.3"
seaborn = "^0.13.2"
pandas = "^2.2.0"
matplotlib = "^3.8.2"
selenium = "^4.16.0"
webdriver-manager = "^4.0.1"
streamlit = "^1.30.0"
pyyaml = "^6.0"

[tool.poetry.scripts]
refresh-events = "scripts.refresh_events:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
