# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - task: dashboard

  teardown:
    desc: Teardown virtual environment
    cmds:
      - rm -rf .venv

  install-poetry:
    desc: Install poetry venv
    cmds:
      - poetry install

  notebook:
    desc: Open a jupyter notebook w/ poetry
    deps: [install-poetry]
    cmds:
      - poetry run jupyter notebook

  clean:
    desc: Clean up cache files
    cmds:
      - 'find . | grep -E "(__pycache__|\.pyc|\.pyo$)" | xargs rm -rf'
      - "rm -rf notebooks/.ipynb_checkpoints"

  # New tasks for scraper and dashboard

  seed:
    desc: Seed v2 database from schema.sql and seed_data.yaml (wipes existing data)
    deps: [install-poetry]
    cmds:
      - poetry run python -m scripts.seed_db

  seed-update:
    desc: Upsert cities/venues/facilitators/tags from seed_data.yaml (preserves event data)
    deps: [install-poetry]
    cmds:
      - poetry run python -m scripts.seed_update

  validate-new:
    desc: Review and validate newly scraped events
    deps: [install-poetry]
    cmds:
      - poetry run python -m scripts.validate_new

  validate-marketing:
    desc: Confirm event details on site before executing marketing tasks
    deps: [install-poetry]
    cmds:
      - poetry run python -m scripts.validate_marketing

  db:
    desc: Open SQLite database in interactive shell
    cmds:
      - sqlite3 data/events.db

  refresh:
    desc: Scrape website and update database
    deps: [install-poetry]
    cmds:
      - poetry run python -m scripts.refresh_events

  refresh-debug:
    desc: Scrape website with browser visible (for debugging)
    deps: [install-poetry]
    cmds:
      - poetry run python -m scripts.refresh_events --no-headless -v

  dashboard:
    desc: Launch Streamlit dashboard
    deps: [install-poetry]
    cmds:
      - poetry run streamlit run dashboard/app.py

  # Docker tasks

  docker-build:
    desc: Build Docker image
    cmds:
      - docker-compose build

  docker-run:
    desc: Run dashboard in Docker
    cmds:
      - docker-compose up

  docker-refresh:
    desc: Run scraper in Docker
    cmds:
      - docker-compose run --rm scraper

  docker-down:
    desc: Stop Docker containers
    cmds:
      - docker-compose down
